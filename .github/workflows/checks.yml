name: Checks

# Manual only: workflows in this public repo run on schedule or workflow_dispatch, never on PRs or forks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: python scripts/check_secrets.py --all
      - run: python -m pytest -q
